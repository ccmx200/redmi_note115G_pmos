name: build evergo images

# Builds the two artifacts users need and publishes them as a release:
#   boot.img         kernel + a small initramfs that mounts userdata and switches into it
#   userdata.img.gz  Arch Linux ARM on f2fs, flashed to the userdata partition
#
# The kernel build has to happen here rather than locally: a cross-compiled kernel plus
# a 6 GiB filesystem is not something to hand users from a laptop.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      ram_gib:
        description: 'RAM size of the handset (4, 6 or 8)'
        default: '6'
        required: true
      panel:
        description: 'panel compatible (Tianma or CSOT)'
        default: 'k16a_36_02_0a_vdo,lcm'
        required: true
      rootfs_mb:
        description: 'size of the rootfs image in MiB'
        default: '6144'
        required: true

env:
  RAM_GIB: ${{ github.event.inputs.ram_gib || '6' }}
  PANEL: ${{ github.event.inputs.panel || 'k16a_36_02_0a_vdo,lcm' }}
  ROOTFS_MB: ${{ github.event.inputs.rootfs_mb || '6144' }}

# publishing a release needs write access; new repositories default to read-only
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ccache bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio gzip xz-utils python3 device-tree-compiler \
            qemu-user-static f2fs-tools android-sdk-libsparse-utils
          aarch64-linux-gnu-gcc --version | head -1
          mkfs.f2fs -V 2>&1 | head -1
          qemu-aarch64-static --version | head -1

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: evergo-ccache-${{ github.run_id }}
          restore-keys: evergo-ccache-

      - name: build
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: report artifacts
        run: |
          ls -l out/
          echo "--- boot.img header ---"
          od -A d -t x1 -N 48 out/boot.img
          echo "--- userdata: is it f2fs? ---"
          file out/userdata.img || true
          dumpe2fs -h out/userdata.img 2>/dev/null | head -3 || true
          echo "--- checksums ---"
          sha256sum out/boot.img out/userdata.img.gz out/userdata.simg > out/SHA256SUMS || true
          cat out/SHA256SUMS || true

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evergo-images
          path: |
            out/boot.img
            out/userdata.img.gz
            out/SHA256SUMS
          retention-days: 14

      - name: publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: evergo build ${{ github.run_number }} (RAM ${{ env.RAM_GIB }} GiB)
          body: |
            Arch Linux ARM on the Redmi Note 11T 5G (evergo / MT6833), mainline Linux.

            | item | value |
            |---|---|
            | RAM variant | ${{ env.RAM_GIB }} GiB |
            | panel | `${{ env.PANEL }}` |
            | rootfs | Arch Linux ARM, f2fs, ${{ env.ROOTFS_MB }} MiB |

            ## flash

            ```bash
            fastboot flash boot_b  boot.img
            fastboot -S 200M flash userdata userdata.simg   # or gunzip userdata.img.gz first
            fastboot --set-active=b
            fastboot reboot
            ```

            Both images are needed: `boot.img` carries the kernel and a small initramfs
            that mounts the filesystem, `userdata.img.gz` is the filesystem itself.

            ## first boot

            There is **no serial console**. The phone comes up as a USB RNDIS network
            device, so it is reached over the network instead:

            * plugged into a **router's USB port** it is a DHCP client and joins that LAN
              with internet access;
            * plugged into a **PC** it always holds `169.254.42.1/16`, so this works with
              no configuration at all:

            ```bash
            ssh root@169.254.42.1      # password: evergo
            ```

            The first login runs a short wizard that can create a normal user, set the
            hostname and change the root password. SSH accepts passwords only - key
            authentication is disabled.

            `evergo-mode pc` switches `usb0` from a DHCP client to a DHCP server, so a
            directly attached computer configures itself on `192.168.42.0/24`.

            **This overwrites the userdata partition, so Android's user data is lost.**
            `fastboot --set-active=a` returns to Android, which will then want to format
            data again.
          files: |
            out/boot.img
            out/userdata.img.gz
            out/SHA256SUMS
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
