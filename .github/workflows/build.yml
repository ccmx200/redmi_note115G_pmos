name: build evergo images

# Builds and publishes the images users flash:
#   boot-<distro>-<ram>gib.img          kernel + initramfs that mounts userdata
#   userdata-<distro>-<ram>gib.simg     the distribution itself, grown on first boot
#
# The kernel is compiled ONCE per RAM variant (job "boot"), not once per distro.
# That job does NOT build any distribution rootfs: the initramfs only needs a
# busybox (downloaded as a static aarch64 binary) and e2fsck/resize2fs for the
# first-boot grow, so it uses a 4 MB Alpine minirootfs plus the e2fsprogs package
# instead of spending minutes in a full Arch/Debian tree.  The distro jobs then
# reuse the boot.img artifact (BOOT_IMG=...) and only build their root filesystem,
# arch included.
#
# RAM variants are not interchangeable: the DTB (and therefore the Image) differs
# between the 6 GiB and 8 GiB units, hence one boot build per RAM size.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      distro:
        description: 'distribution'
        type: choice
        options: [arch, debian, ubuntu, fedora, all]
        default: 'all'
        required: true
      ram_gib:
        description: 'RAM size (6 or 8; "all" builds both)'
        type: choice
        options: ['6', '8', 'all']
        default: 'all'
        required: true
      panel:
        description: 'panel compatible (Tianma or CSOT)'
        default: 'k16a_36_02_0a_vdo,lcm'
        required: true
      rootfs_mb:
        description: 'size of the rootfs image in MiB'
        default: '6144'
        required: true

env:
  PANEL: ${{ github.event.inputs.panel || 'k16a_36_02_0a_vdo,lcm' }}
  ROOTFS_MB: ${{ github.event.inputs.rootfs_mb || '6144' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache

permissions:
  contents: write

jobs:
  # strategy.matrix cannot read inputs directly, so the matrices are computed here
  plan:
    runs-on: ubuntu-24.04
    outputs:
      boots: ${{ steps.plan.outputs.boots }}
      rootfs: ${{ steps.plan.outputs.rootfs }}
    steps:
      - id: plan
        run: |
          distro="${{ github.event.inputs.distro || 'all' }}"
          ram="${{ github.event.inputs.ram_gib || 'all' }}"
          [ "$distro" = "all" ] && distros="arch debian ubuntu fedora" || distros="$distro"
          [ "$ram"    = "all" ] && rams="6 8"                              || rams="$ram"

          # boot images: one kernel build per RAM variant, no distribution rootfs
          boots=""
          for r in $rams; do
            [ -n "$boots" ] && boots="$boots,"
            boots="$boots{\"ram\":\"$r\"}"
          done
          echo "boots={\"include\":[$boots]}" >> "$GITHUB_OUTPUT"

          # rootfs jobs: every requested distribution, each reusing the boot image
          rootfs=""
          for d in $distros; do
            for r in $rams; do
              [ -n "$rootfs" ] && rootfs="$rootfs,"
              rootfs="$rootfs{\"distro\":\"$d\",\"ram\":\"$r\"}"
            done
          done
          echo "rootfs={\"include\":[$rootfs]}" >> "$GITHUB_OUTPUT"
          echo "boot builds: $boots"
          echo "rootfs builds: $rootfs"

  # One kernel build per RAM variant; produces boot-<ram>gib.img only, no distro rootfs.
  boot:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.boots) }}
    name: boot / ${{ matrix.ram }} GiB
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          df -h /

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq upgrade
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ccache bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio gzip xz-utils zstd p7zip-full python3 device-tree-compiler patch \
            debootstrap \
            e2fsprogs qemu-user-static android-sdk-libsparse-utils
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64-static --version | head -1

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: evergo-ccache-${{ hashFiles('build.sh', 'config/evergo.config') }}-${{ matrix.ram }}
          restore-keys: |
            evergo-ccache-${{ hashFiles('build.sh', 'config/evergo.config') }}-
            evergo-ccache-

      - name: prepare initramfs bootstrap rootfs (Alpine + e2fsprogs)
        run: |
          set -e
          base="https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/releases/aarch64"
          name=$(curl -fsSL "$base/" | grep -oE 'alpine-minirootfs-[0-9.]+-aarch64\.tar\.gz' | head -1)
          echo "using $name"
          curl -fsSL -o /tmp/alpine.tgz "$base/$name"
          mkdir -p rootfs-alpine
          sudo tar xzf /tmp/alpine.tgz -C rootfs-alpine
          sudo cp /usr/bin/qemu-aarch64-static rootfs-alpine/usr/bin/
          echo "https://mirrors.tuna.tsinghua.edu.cn/alpine/latest-stable/main" | sudo tee rootfs-alpine/etc/apk/repositories
          sudo cp /etc/resolv.conf rootfs-alpine/etc/resolv.conf
          sudo chroot rootfs-alpine /usr/bin/qemu-aarch64-static /bin/sh -c 'apk add --no-cache e2fsprogs e2fsprogs-extra'
          sudo find rootfs-alpine -maxdepth 3 \( -name e2fsck -o -name resize2fs \) -printf '%p\n'

      - name: build kernel (no distribution rootfs)
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E env "PATH=$PATH" "HOME=$HOME" "CCACHE_DIR=$CCACHE_DIR" \
            "KERNEL_ONLY=1" \
            "INITRAMFS_ROOTFS=$PWD/rootfs-alpine" \
            "RAM_GIB=${{ matrix.ram }}" \
            "PANEL=$PANEL" ./build.sh

      - name: ccache stats
        if: always()
        run: ccache -s || sudo ccache -s || true

      - name: stage boot image
        run: |
          set -e
          r="${{ matrix.ram }}"
          mkdir -p boot
          cp out/boot.img "boot/boot-${r}gib.img"
          ls -l boot/

      - name: upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: evergo-boot-${{ matrix.ram }}gib
          path: boot/boot-*.img
          retention-days: 14

  # One rootfs per distribution (arch included); the kernel comes from the boot job.
  distro:
    needs: [plan, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rootfs) }}
    name: ${{ matrix.distro }} / ${{ matrix.ram }} GiB
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          df -h /

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq upgrade
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ccache bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio gzip xz-utils zstd p7zip-full python3 device-tree-compiler patch \
            debootstrap \
            e2fsprogs qemu-user-static android-sdk-libsparse-utils
          mke2fs -V 2>&1 | head -1
          qemu-aarch64-static --version | head -1

      - name: download prebuilt boot image
        uses: actions/download-artifact@v4
        with:
          name: evergo-boot-${{ matrix.ram }}gib
          path: prebuilt

      - name: build rootfs + userdata (kernel reused)
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            "DISTRO=${{ matrix.distro }}" \
            "RAM_GIB=${{ matrix.ram }}" \
            "PANEL=$PANEL" "ROOTFS_MB=$ROOTFS_MB" \
            "BOOT_IMG=$PWD/prebuilt/boot-${{ matrix.ram }}gib.img" ./build.sh

      - name: rename artifacts
        run: |
          set -e
          d="${{ matrix.distro }}"; r="${{ matrix.ram }}"
          mkdir -p dist
          cp out/boot.img      "dist/boot-${d}-${r}gib.img"
          cp out/userdata.simg "dist/userdata-${d}-${r}gib.simg"
          SZ=$(stat -c%s "dist/userdata-${d}-${r}gib.simg")
          LIMIT=2147483648
          if [ "$SZ" -gt "$LIMIT" ]; then
              echo "::error::userdata-${d}-${r}gib.simg is $SZ bytes, over GitHub's 2 GiB asset limit"
              exit 1
          fi
          echo "userdata-${d}-${r}gib.simg = $SZ bytes"
          (cd dist && sha256sum * > "SHA256SUM-${d}-${r}gib.txt")
          ls -l dist/
          echo "--- userdata is ext4? ---"
          file out/userdata.img || true
          dumpe2fs -h out/userdata.img 2>/dev/null | grep -E "volume name|Block count|Inode count" || true

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evergo-${{ matrix.distro }}-${{ matrix.ram }}gib
          path: dist/*
          retention-days: 14

      - name: publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: evergo build ${{ github.run_number }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
