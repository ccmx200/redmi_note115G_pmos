name: build evergo images

# Builds and publishes the images users flash:
#   boot-<distro>-<ram>gib.img          kernel + initramfs that mounts userdata
#   userdata-<distro>-<ram>gib.img.gz   the distribution itself, grown on first boot
#
# The kernel has to be built here rather than locally.  Each distro only differs in the
# root filesystem, which scripts/distro-<name>.sh produces.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      distro:
        description: 'distribution'
        type: choice
        options: [arch, debian, ubuntu, fedora, all]
        default: 'all'
        required: true
      ram_gib:
        description: 'RAM size (6 or 8; "all" builds both)'
        type: choice
        options: ['6', '8', 'all']
        default: 'all'
        required: true
      panel:
        description: 'panel compatible (Tianma or CSOT)'
        default: 'k16a_36_02_0a_vdo,lcm'
        required: true
      rootfs_mb:
        description: 'size of the rootfs image in MiB'
        default: '6144'
        required: true

env:
  PANEL: ${{ github.event.inputs.panel || 'k16a_36_02_0a_vdo,lcm' }}
  ROOTFS_MB: ${{ github.event.inputs.rootfs_mb || '6144' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache

permissions:
  contents: write

jobs:
  # the matrix has to be computed in a job: `strategy.matrix` cannot read inputs directly
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          distro="${{ github.event.inputs.distro || 'all' }}"
          ram="${{ github.event.inputs.ram_gib || 'all' }}"
          [ "$distro" = "all" ] && distros="arch debian ubuntu fedora" || distros="$distro"
          [ "$ram"    = "all" ] && rams="6 8"                              || rams="$ram"
          entries=""
          for d in $distros; do
            for r in $rams; do
              [ -n "$entries" ] && entries="$entries,"
              entries="$entries{\"distro\":\"$d\",\"ram\":\"$r\"}"
            done
          done
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.distro }} / ${{ matrix.ram }} GiB
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          df -h /

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ccache bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio gzip xz-utils zstd p7zip-full python3 device-tree-compiler \
            e2fsprogs qemu-user-static android-sdk-libsparse-utils \
            mmdebstrap debootstrap dnf rpm debian-archive-keyring
          aarch64-linux-gnu-gcc --version | head -1
          mke2fs -V 2>&1 | head -1
          qemu-aarch64-static --version | head -1
          mmdebstrap --version | head -1

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: evergo-ccache-${{ hashFiles('build.sh', 'config/evergo.config') }}-${{ matrix.ram }}
          restore-keys: |
            evergo-ccache-${{ hashFiles('build.sh', 'config/evergo.config') }}-
            evergo-ccache-

      - name: build
        # the build chroots into a directory, so it must run as root
        run: |
          chmod +x build.sh scripts/*.sh
          sudo -E env "PATH=$PATH" "HOME=$HOME" "CCACHE_DIR=$CCACHE_DIR" \
            "DISTRO=${{ matrix.distro }}" \
            "RAM_GIB=${{ matrix.ram }}" \
            "PANEL=$PANEL" "ROOTFS_MB=$ROOTFS_MB" ./build.sh

      - name: ccache stats
        if: always()
        run: ccache -s || sudo ccache -s || true

      - name: rename artifacts
        run: |
          set -e
          d="${{ matrix.distro }}"; r="${{ matrix.ram }}"
          mkdir -p dist
          cp out/boot.img          "dist/boot-${d}-${r}gib.img"
          cp out/userdata.img.gz   "dist/userdata-${d}-${r}gib.img.gz"
          (cd dist && sha256sum * > "SHA256SUM-${d}-${r}gib.txt")
          ls -l dist/
          echo "--- userdata is ext4? ---"
          file out/userdata.img || true
          dumpe2fs -h out/userdata.img 2>/dev/null | grep -E "volume name|Block count|Inode count" || true

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evergo-${{ matrix.distro }}-${{ matrix.ram }}gib
          path: dist/*
          retention-days: 14

      - name: publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: evergo build ${{ github.run_number }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
