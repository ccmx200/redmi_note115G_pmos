name: build evergo images

# Builds the two artifacts users need and publishes them as a release:
#   boot.img      kernel + initramfs installer
#   userdata.img  prebuilt ext4 rootfs (Alpine)
#
# The build has to happen here rather than locally because a kernel build plus a
# 1.5 GiB filesystem is not something to hand to users from a laptop.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      ram_gib:
        description: 'RAM size of the handset (4, 6 or 8)'
        default: '6'
        required: true
      panel:
        description: 'panel compatible (Tianma or CSOT)'
        default: 'k16a_36_02_0a_vdo,lcm'
        required: true
      rootfs_mb:
        description: 'size of the rootfs image in MiB'
        default: '1536'
        required: true
      distro:
        description: 'rootfs distribution (alpine)'
        default: 'alpine'
        required: true

env:
  RAM_GIB: ${{ github.event.inputs.ram_gib || '6' }}
  PANEL: ${{ github.event.inputs.panel || 'k16a_36_02_0a_vdo,lcm' }}
  ROOTFS_MB: ${{ github.event.inputs.rootfs_mb || '1536' }}
  DISTRO: ${{ github.event.inputs.distro || 'alpine' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ccache bc bison flex libssl-dev libelf-dev libncurses-dev \
            e2fsprogs cpio gzip xz-utils python3 device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1
          mke2fs -V 2>&1 | head -1

      - name: restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: evergo-ccache-${{ github.run_id }}
          restore-keys: evergo-ccache-

      - name: build
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: report artifacts
        run: |
          ls -l out/
          echo "--- boot.img header ---"
          od -A d -t x1 -N 48 out/boot.img
          echo "--- userdata contents ---"
          debugfs -R 'cat /etc/alpine-release' out/userdata.img 2>/dev/null || true
          echo "--- checksums ---"
          sha256sum out/boot.img out/userdata.img out/userdata.img.gz > out/SHA256SUMS || true
          cat out/SHA256SUMS || true

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evergo-images
          path: |
            out/boot.img
            out/userdata.img.gz
            out/SHA256SUMS
          retention-days: 14

      - name: publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: evergo build ${{ github.run_number }} (RAM ${RAM_GIB} GiB)
          body: |
            Alpine ${{ env.DISTRO }} rootfs on the Redmi Note 11T 5G, mainline Linux.

            | item | value |
            |---|---|
            | RAM variant | ${{ env.RAM_GIB }} GiB |
            | panel | `${{ env.PANEL }}` |
            | rootfs | ${{ env.DISTRO }}, ${{ env.ROOTFS_MB }} MiB |

            ## flash

            ```bash
            fastboot flash boot_b  boot.img
            fastboot flash userdata userdata.img
            fastboot --set-active=b
            fastboot reboot
            ```

            `boot.img` alone is enough: it carries a compressed rootfs and installs
            itself on the first boot. `userdata.img` is for flashing the partition
            directly.

            The console is the USB gadget serial port (`/dev/ttyGS0`) - plug the
            phone into a PC and open the new COM port at 115200 8N1.

            **This overwrites the userdata partition, so Android's user data is
            lost.** `fastboot --set-active=a` returns to Android, which will then
            want to format data again.
          files: |
            out/boot.img
            out/userdata.img.gz
            out/SHA256SUMS
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
